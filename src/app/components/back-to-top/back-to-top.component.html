<div class="fixed-buttons">
  @if (showButton()) {
    <button
      type="button"
      class="back-to-top-btn"
      [attr.aria-label]="backToTopAria()"
      (click)="scrollToTop()"
    >
      <span aria-hidden="true">↑</span>
    </button>
  }

  <a
    href="https://wa.me/+1234567890"
    target="_blank"
    rel="noopener noreferrer"
    class="whatsapp-btn"
    [attr.aria-label]="whatsappAria()"
  >
    <i class="fab fa-whatsapp"></i>
  </a>
</div>
