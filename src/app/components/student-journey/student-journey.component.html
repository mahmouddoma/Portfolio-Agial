<section
  #journeySection
  class="student-journey"
  [class.student-journey--live-edit]="isLiveEdit()"
  aria-labelledby="student-journey-title"
>
  <div class="journey-shell">
    <header class="journey-header">
      <span
        class="journey-kicker journey-gsap-title"
        [appEditableContent]="'journey.section.kicker'"
        editableLabel="Journey kicker"
        editableType="text"
      >{{ section().kicker }}</span>
      <h2
        id="student-journey-title"
        class="journey-title journey-gsap-title"
        [appEditableContent]="'journey.section.title'"
        editableLabel="Journey title"
        editableType="text"
      >
        {{ section().title }}
      </h2>
      <p
        class="journey-description journey-gsap-title"
        [appEditableContent]="'journey.section.description'"
        editableLabel="Journey description"
        editableType="textarea"
      >
        {{ section().description }}
      </p>
    </header>

    <div class="journey-stage">
      <aside class="journey-panel" [attr.aria-label]="section().panelAria">
        <span
          class="journey-panel__phase"
          [appEditableContent]="'journey.steps.' + activeStep().index + '.phase'"
          editableLabel="Journey step phase"
          editableType="text"
        >{{ activeStep().phase }}</span>
        <h3
          [appEditableContent]="'journey.steps.' + activeStep().index + '.title'"
          editableLabel="Journey step title"
          editableType="text"
        >{{ activeStep().title }}</h3>
        <p
          [appEditableContent]="'journey.steps.' + activeStep().index + '.description'"
          editableLabel="Journey step description"
          editableType="textarea"
        >{{ activeStep().description }}</p>

        <div class="journey-panel__metric">
          <strong
            [appEditableContent]="'journey.steps.' + activeStep().index + '.metric'"
            editableLabel="Journey step metric"
            editableType="text"
          >{{ activeStep().metric }}</strong>
          <span
            [appEditableContent]="'journey.steps.' + activeStep().index + '.detail'"
            editableLabel="Journey step detail"
            editableType="textarea"
          >{{ activeStep().detail }}</span>
        </div>
      </aside>

      <div class="journey-map" role="list" [attr.aria-label]="section().mapAria">
        <svg class="journey-path" viewBox="0 0 820 620" preserveAspectRatio="none" aria-hidden="true">
          <defs>
            <linearGradient id="journeyGradient" x1="720" y1="48" x2="98" y2="572" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#d7b46a"></stop>
              <stop offset="0.48" stop-color="#21c99b"></stop>
              <stop offset="1" stop-color="#0f5b4c"></stop>
            </linearGradient>
          </defs>
          <path
            class="journey-path__track"
            d="M720 48 C520 92 606 184 392 218 C184 252 148 334 346 382 C548 430 528 530 98 572"
          ></path>
          <path
            #journeyPathProgress
            class="journey-path__progress"
            d="M720 48 C520 92 606 184 392 218 C184 252 148 334 346 382 C548 430 528 530 98 572"
          ></path>
        </svg>

        @for (step of steps(); track step.id; let index = $index) {
          <button
            #journeyStep
            type="button"
            class="journey-step"
            [class.journey-step--active]="activeStepIndex() === index"
            (mouseenter)="setActiveStep(index)"
            (focus)="setActiveStep(index)"
            [attr.aria-current]="activeStepIndex() === index ? 'step' : null"
          >
            <span
              class="journey-step__dot"
              [appEditableContent]="'journey.steps.' + step.index + '.phase'"
              editableLabel="Journey map phase"
              editableType="text"
            >{{ step.phase }}</span>
            <span class="journey-step__content">
              <strong
                [appEditableContent]="'journey.steps.' + step.index + '.title'"
                editableLabel="Journey map title"
                editableType="text"
              >{{ step.title }}</strong>
              <small
                [appEditableContent]="'journey.steps.' + step.index + '.description'"
                editableLabel="Journey map description"
                editableType="textarea"
              >{{ step.description }}</small>
            </span>
          </button>
        }
      </div>
    </div>
  </div>
</section>
