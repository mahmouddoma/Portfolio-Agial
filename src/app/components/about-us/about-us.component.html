<section
  #heroSection
  class="about-us-section d-flex align-items-center justify-content-center text-center text-white min-vh-100"
  [attr.dir]="direction()"
  aria-labelledby="hero-title"
>
  <div class="slider w-100" aria-hidden="true">
    <div
      *ngFor="let slide of localizedSlides(); let i = index"
      class="slide"
      [class.active]="currentSlide === i"
    >
      <img [src]="slide.src" [alt]="slide.alt" loading="lazy" decoding="async" />
    </div>
    <div class="overlay"></div>
  </div>

  <div class="container position-relative z-2 px-3 px-md-4 hero-content">
    <div class="row justify-content-center">
      <div class="col-12 col-md-11 col-lg-9 col-xl-8">
        <span class="hero-eyebrow">{{ eyebrow() }}</span>
        <h1 id="hero-title" class="hero-title" [attr.dir]="direction()">{{ sectionTitle() }}</h1>
        <p class="hero-description">
          {{ description() }}
        </p>
        <div class="hero-actions">
          <a class="hero-action hero-action-primary" href="#packages"
            >{{ primaryAction() }}</a
          >
          <a class="hero-action hero-action-secondary" href="#our-services"
            >{{ secondaryAction() }}</a
          >
        </div>
        <div class="hero-metrics" [attr.aria-label]="metricsAria()">
          @for (metric of metrics(); track metric) {
            <span>{{ metric }}</span>
          }
        </div>
      </div>
    </div>
  </div>
  <div class="pagination">
    <span
      *ngFor="let slide of localizedSlides(); let i = index"
      class="dot"
      [class.active]="currentSlide === i"
      (click)="setCurrentSlide(i)"
    ></span>
  </div>
</section>

<app-slider></app-slider>
