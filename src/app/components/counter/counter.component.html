<section class="counters-section" aria-labelledby="counters-title">
  <h2
    id="counters-title"
    class="visually-hidden"
    [appEditableContent]="'countersTitle'"
    editableLabel="Counters title"
    editableType="text"
  >{{ getTitle() }}</h2>

  <div class="counter-container">
    @for (counter of counters; track counter.icon; let index = $index) {
      <article
        #counterElement
        class="counter-item"
        [class.counter-item--active]="counter.started"
        [attr.data-counter-index]="index"
        role="region"
        [attr.aria-label]="getCounterLabel(counter)"
      >
        <div class="counter-icon" aria-hidden="true">
          <i
            [class]="counter.icon"
            [appEditableContent]="'counters.' + index + '.icon'"
            editableLabel="Counter icon"
            editableType="text"
          ></i>
        </div>

        <div class="counter-number">
          <span
            class="counter-value"
            [attr.data-target]="counter.target"
            [appEditableContent]="'counters.' + index + '.target'"
            editableLabel="Counter target"
            editableType="number"
          >
            {{ formatNumber(counter.count) }}
          </span>
          <span class="counter-suffix" aria-hidden="true">+</span>
        </div>

        <p
          class="counter-label"
          [appEditableContent]="'counters.' + index + '.label'"
          editableLabel="Counter label"
          editableType="text"
        >{{ getCounterLabel(counter) }}</p>
      </article>
    }
  </div>
</section>
