<header #navbarRef class="site-header" [class.site-header--scrolled]="isScrolled">
  <nav class="site-header__shell" [attr.aria-label]="navigationAriaLabel()">
    <a class="site-brand" href="#about" [attr.aria-label]="brandName()" (click)="scrollTo($event, 'about')">
      <img
        [src]="brandLogoSrc()"
        [alt]="brandLogoAlt()"
        width="42"
        height="42"
        loading="lazy"
        decoding="async"
        [appEditableContent]="'header.logoSrc'"
        editableLabel="Header logo"
        editableType="image"
      />
      <span
        [appEditableContent]="'header.brandName'"
        editableLabel="Header brand name"
        editableType="text"
      >{{ brandName() }}</span>
    </a>

    <button
      type="button"
      class="mobile-language-toggle"
      [attr.aria-label]="languageSwitchAriaLabel()"
      (click)="toggleLanguage()"
    >
      {{ languageSwitchLabel() }}
    </button>

    <button
      type="button"
      class="menu-toggle"
      aria-controls="primary-navigation"
      [attr.aria-expanded]="isMenuOpen"
      [attr.aria-label]="menuToggleAriaLabel()"
      (click)="toggleMenu()"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>

    <div id="primary-navigation" class="nav-panel" [class.nav-panel--open]="isMenuOpen">
      @for (item of navItems(); track item.id) {
        <a
          class="nav-link"
          [class.nav-link--active]="isActive(item.id)"
          [attr.aria-current]="isActive(item.id) ? 'page' : null"
          [href]="'#' + item.id"
          (click)="scrollTo($event, item.id)"
          [appEditableContent]="item.path"
          editableLabel="Navigation label"
          editableType="text"
        >
          {{ item.label }}
        </a>
      }

      <button
        type="button"
        class="language-toggle"
        [attr.aria-label]="languageSwitchAriaLabel()"
        (click)="toggleLanguage()"
      >
        {{ languageSwitchLabel() }}
      </button>

      <button
        type="button"
        class="admin-login-button"
        [attr.aria-label]="loginAriaLabel()"
        [appEditableContent]="'header.loginLabel'"
        editableLabel="Admin login label"
        editableType="text"
        (click)="openAdminLogin()"
      >
        {{ loginLabel() }}
      </button>
    </div>
  </nav>
</header>
