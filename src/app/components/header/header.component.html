<header #navbarRef class="site-header" [class.site-header--scrolled]="isScrolled">
  <nav class="site-header__shell" [attr.aria-label]="navigationAriaLabel()">
    <a class="site-brand" href="#about" [attr.aria-label]="brandName()" (click)="scrollTo($event, 'about')">
      <img
        src="assets/images/Logo.jpg"
        [alt]="brandLogoAlt()"
        width="42"
        height="42"
        loading="lazy"
        decoding="async"
      />
      <span>{{ brandName() }}</span>
    </a>

    <button
      type="button"
      class="menu-toggle"
      aria-controls="primary-navigation"
      [attr.aria-expanded]="isMenuOpen"
      [attr.aria-label]="menuToggleAriaLabel()"
      (click)="toggleMenu()"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>

    <div id="primary-navigation" class="nav-panel" [class.nav-panel--open]="isMenuOpen">
      @for (item of navItems(); track item.id) {
        <a
          class="nav-link"
          [class.nav-link--active]="isActive(item.id)"
          [attr.aria-current]="isActive(item.id) ? 'page' : null"
          [href]="'#' + item.id"
          (click)="scrollTo($event, item.id)"
        >
          {{ item.label }}
        </a>
      }

      <button
        type="button"
        class="language-toggle"
        [attr.aria-label]="languageSwitchAriaLabel()"
        (click)="toggleLanguage()"
      >
        {{ languageSwitchLabel() }}
      </button>
    </div>
  </nav>
</header>
