<section class="admin-page admin-layout" dir="rtl">
  <header class="admin-header" dir="rtl">
    <div class="admin-header-brand">
      <h1>أجيال القرآن Admin</h1>
    </div>

    <nav class="admin-nav" aria-label="Admin navigation" dir="rtl">
      <a class="admin-nav-link" routerLink="/admin/dashboard" routerLinkActive="active">Dashboard</a>
      <a class="admin-nav-link" routerLink="/admin/content" routerLinkActive="active">Content</a>
      <a class="admin-nav-link" routerLink="/admin/media" routerLinkActive="active">Media</a>
      <a class="admin-nav-link" routerLink="/admin/live-edit" routerLinkActive="active">Live Edit</a>
      <a class="admin-nav-link" routerLink="/">عرض البورتفوليو</a>
    </nav>

    <div class="admin-header-session" dir="rtl">
      <div class="admin-header-user">
        <strong dir="ltr">{{ adminEmail() }}</strong>
      </div>
      <button type="button" class="admin-button-secondary" (click)="logout()">تسجيل خروج</button>
    </div>
  </header>

  <main class="admin-main">
    <div class="admin-page-content">
      <router-outlet></router-outlet>
    </div>
  </main>

  <app-back-to-top variant="admin" [showWhatsApp]="false"></app-back-to-top>

  <footer class="admin-footer" dir="ltr">
    <span>Powered by</span>
    <app-portfolio-logo-icon
      variant="full"
      animation="none"
      accentColor="#00d7ff"
      textColor="#e8f0fe"
      width="clamp(82px, 9vw, 126px)"
    />
  </footer>
</section>
